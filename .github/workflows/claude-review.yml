name: Claude review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          track_progress: true
          claude_args: --max-turns 40
          prompt: |
            Review this pull request.

            Start from CLAUDE.md, which points at the skills in .claude/skills.
            Read the skill that matches what the diff touches rather than all of
            them: portfolio-code for TypeScript and React, portfolio-ui for
            anything a visitor sees, portfolio-copy for text a visitor reads,
            portfolio-data for Sanity, GROQ and data fetching.

            Two rules apply to every file, including YAML and shell: no em
            dashes, ellipsis characters, smart quotes or non-breaking spaces,
            and no comment that justifies why a change was made.

            docs/architecture.md records the budgets and the constraints the
            static export imposes. Flag anything that breaks one.

            Always post a comment, including when you find nothing. A silent
            reviewer cannot be told apart from a broken one. If the change looks
            sound, say so in a sentence rather than inventing findings.

            Do not approve, do not request changes as a blocking state, and do
            not push commits. You are an additional reader, never a substitute
            for human review or a merge gate.
