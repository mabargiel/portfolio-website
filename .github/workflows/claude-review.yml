name: Claude review

# The one piece that runs in GitHub Actions rather than Azure Pipelines,
# because pull request comments belong where the pull request is.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          claude_args: --max-turns 15
          prompt: |
            Review this pull request against the conventions this repository
            already documents. Read CLAUDE.md and the relevant skills in
            .claude/skills before commenting:

            - portfolio-code for TypeScript and React, including the rule that
              the default is no comment and that comments must never narrate
              the code or the session that wrote it
            - portfolio-ui for anything a visitor sees
            - portfolio-copy for any text a visitor reads
            - portfolio-data for Sanity, GROQ and data fetching

            Also check the two rules that apply everywhere: no em dashes,
            ellipsis characters, smart quotes or non-breaking spaces, and no
            AI-slop prose.

            docs/architecture.md records the budgets and the constraints the
            static export imposes. Flag anything that breaks one.

            Comment on what you find. Do not approve, do not request changes as
            a blocking state, and do not push commits. You are an additional
            reader, never a substitute for human review or a merge gate. If the
            change looks sound, say so briefly rather than inventing findings.
